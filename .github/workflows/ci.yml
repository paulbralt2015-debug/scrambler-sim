name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1
          pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m py_compile scrambler_sim.py
      - name: Tests
        run: pytest -q
