name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1
          pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m py_compile scrambler_sim.py
      - name: Tests
        run: pytest -q

  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (Linux libs)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --onefile --name scrambler_sim scrambler_sim.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrambler_sim-${{ runner.os }}
          path: dist/*
